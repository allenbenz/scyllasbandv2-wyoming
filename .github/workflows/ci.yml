name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    # Weekly model e2e: Monday 05:00 UTC
    - cron: "0 5 * * 1"

# Cancel superseded runs on the same branch/PR instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # ruff + mypy share one environment; splitting them just duplicated the
    # checkout + python + uv sync setup on every run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run unit and integration tests
        run: uv run --frozen pytest -m "not e2e and not docker" -v

  e2e:
    # Real model on CPU; downloads ~500 MB (cached between runs).
    # Manual + weekly only (disabled on ordinary pushes/PRs to save runner time).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository_owner == 'allenbenz')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: data/models
          key: scyllasbandv2-models-${{ runner.os }}
      - name: Run e2e tests
        env:
          SCYLLASBAND_E2E: "1"
          SCYLLASBAND_DEVICE: cpu
        run: uv run --frozen pytest -m e2e -v
